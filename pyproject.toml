[project]
name = "perchance-mcp-unlimited"
version = "1.0.0"
description = "MCP server for Perchance.org Stable Diffusion AI - Fully open-source unlimited, no API keys, bypasses Cloudflare & Turnstile via curl_cffi + SeleniumBase UC Mode"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Perchance MCP Contributors"}]
keywords = ["mcp", "perchance", "stable-diffusion", "ai", "image-generation", "curl-cffi", "seleniumbase", "turnstile", "cloudflare-bypass"]
dependencies = [
    "mcp<2",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "playwright-stealth>=2.0.0",
    "curl_cffi>=0.11.0",
    "camoufox>=0.4.0",
    "seleniumbase>=4.0.0",
    "nodriver>=0.42",
]

[project.scripts]
perchance-mcp = "perchance_mcp.server:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["client", "server"]
